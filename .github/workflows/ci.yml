name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        name: Format, Test and Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run scoring tests
              run: npm run test --workspace=@mission-control/rules

            - name: Build shared rules
              run: npm run build --workspace=@mission-control/rules

            - name: API integration tests
              run: npm run test:api
              working-directory: apps/server

            - name: Build backend
              run: npm run build --workspace=@mission-control/server

            - name: Build frontend
              run: npm run build --workspace=@mission-control/web
